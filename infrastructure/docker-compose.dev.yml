# Local development dependencies only.
# Postgres stands in for Supabase PostgreSQL; SeaweedFS stands in for Cloudflare R2
# (S3-compatible API). See docs/deviations.md (D-001).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"

  s3:
    # SeaweedFS in single-process mode with the S3 gateway enabled.
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - s3-data:/data
      - ./seaweedfs-s3.dev.json:/etc/seaweedfs/s3.json:ro

volumes:
  pg-data:
  s3-data:
